# ==============================================================================
# AI Test Agent 单源反代
# 浏览器只需访问 :80 —— 前端 / API / LangGraph 全部同源，规避 CORS
#
# 注意：所有 proxy_pass 均使用变量形式 + Docker 内嵌 DNS resolver，
# 强制运行时重新解析上游主机名。否则后端容器重建（IP 变化）后 nginx
# 仍连接启动时缓存的旧 IP，导致 502 Bad Gateway。
# ==============================================================================

# GitNexus 图数据缓存区（/api/graph 全量图响应 >10MB，上游生成需数分钟）
proxy_cache_path /var/cache/nginx/gitnexus levels=1:2 keys_zone=gitnexus:10m max_size=500m inactive=60m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker 内嵌 DNS，10s 重新解析一次上游主机名
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 附件上限 50MB（对应 ATTACHMENT_MAX_SIZE=52428800），留余量
    client_max_body_size 60m;

    # 压缩大体积 JSON/NDJSON 响应（gitnexus 全量图 38.7MB -> ~4MB，显著缩短公网传输）
    gzip on;
    gzip_proxied any;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/x-ndjson;

    # ---- FastAPI（浏览器普通 API + SSE 直连，一跳直达，不经过 Next） ----
    location /api/ {
        set $upstream_backend http://backend:8001;
        proxy_pass $upstream_backend; # 变量形式无 URI 部分，/api/... 原样透传
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 必需：关闭缓冲，长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- LangGraph Server（浏览器 SDK 直连：threads/runs/stream） ----
    location /langgraph/ {
        # 变量形式 proxy_pass 不支持"尾斜杠剥离前缀"，用 rewrite 等价实现。
        # 注意：set 必须在 rewrite...break 之前，否则 break 会跳过 set，变量为空
        set $upstream_langgraph http://langgraph:2026;
        rewrite ^/langgraph(/.*)$ $1 break;
        proxy_pass $upstream_langgraph;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # /runs/stream 等 SSE 端点必需
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- GitNexus 全量图接口（重：36k+节点 NDJSON 流，上游 CPU 密集 2-5min）----
    # 图数据只随索引（按 commit）变化，缓存 30min；并发回源合并，首个请求后秒开。
    location = /gitnexus-api/api/graph {
        set $upstream_gitnexus http://gitnexus:4747;
        rewrite ^/gitnexus-api(/.*)$ $1 break;
        proxy_pass $upstream_gitnexus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache gitnexus;
        proxy_cache_key $uri$is_args$args;
        # 上游流式接口固定返回 Cache-Control: no-cache，会禁止 nginx 缓存，需忽略
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 200 30m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 600s;
        proxy_read_timeout 1200s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- GitNexus 代码智能分析 API ----
    location /gitnexus-api/ {
        set $upstream_gitnexus http://gitnexus:4747;
        rewrite ^/gitnexus-api(/.*)$ $1 break;
        proxy_pass $upstream_gitnexus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ---- FastAPI 根路径工具端点（便于部署验证与 API 文档） ----
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        set $upstream_backend_root http://backend:8001;
        proxy_pass $upstream_backend_root;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Next.js 前端 ----
    location / {
        set $upstream_ui http://ui:3000;
        proxy_pass $upstream_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
